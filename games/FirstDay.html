<html>
    <head>
        <title>Game Loop</title>
        <style>
            *{
                margin:0;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <canvas id="canv">
    
        </canvas>
        <script src="Vector2.js"></script>
        <script>
            let canvas = document.querySelector("#canv")
            let ctx = canvas.getContext("2d")
           



            //position
            let position = new Vector2(50, 50)
            

            function gameLoop(){
                update()
                draw()
                requestAnimationFrame(gameLoop)
                
            }
            function update(){
            position.x = position.x + 2
            }
            function draw(){
            //canvas size
            canvas.width = window.innerWidth
            canvas.height = window.innerHeight

           //going to draw something
            ctx.save()
           //center
            ctx.translate(position.x, position.y)
            ctx.lineTo(0, -20)
            ctx.lineTo(10, -30)
            ctx.lineTo(10, 0)
            ctx.lineTo(50, -40)
            ctx.lineTo(60, -50)
            ctx.lineTo(55, 0)
            ctx.lineTo(0, 40)
           
           
            ctx.fillStyle = "black"
            ctx.fill()
            ctx.restore()
        }
        requestAnimationFrame(gameLoop)
        
        


        </script>
    </body>
</html>
