<html>
    <head>
        <title>Drawing!</title>
    </head>
    <body>
        <canvas id="canv">
    
        </canvas>
        <script>
            let canvas = document.querySelector("#canv")
            let ctx = canvas.getContext("2d")
           

            //canvas size
            canvas.width = window.innerWidth
            canvas.height = window.innerHeight
           //going to draw something
            ctx.save()
           //center
            ctx.translate(50, 50)
            ctx.lineTo(0, -20)
            ctx.lineTo(10, -30)
            ctx.lineTo(10, 0)
            ctx.lineTo(50, -40)
            ctx.lineTo(60, -50)
            ctx.lineTo(55, 0)
            ctx.lineTo(0, 40)
           
           
            ctx.fillStyle = "black"
            ctx.fill()
            ctx.restore()

        </script>
    </body>
</html>
